<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pentest Report</title>
</head>
<body>
    <h1>Web Application Pentest</h1>
    <p>Target: http://localhost</p>

    <h2>Vulnerabilities Findings</h2>

    {%for finding in findings%}
        <h3>{{finding.title}}</h3>
        <p>CVSS: {{ finding.cvss }}</p>
    {% endfor %}
</body>
</html>
